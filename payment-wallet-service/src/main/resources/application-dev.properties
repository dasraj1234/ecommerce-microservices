# Dev profile: connects to the MySQL container defined in docker-compose.yml.
# Only the datasource is overridden here; everything else is inherited from
# application.properties. Activate with: --spring.profiles.active=dev
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=myuser
spring.datasource.password=mypassword
