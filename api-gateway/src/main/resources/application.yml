server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        add-to-simple-url-handler-mapping: true
    
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8082"
              - "http://localhost:5173"
              - "http://localhost:4173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**,/auth/**
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**,/orders/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/wallet/**,/payments/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE