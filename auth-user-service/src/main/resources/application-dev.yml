spring:
  application:
    name: authN_Z
  datasource:
    url: jdbc:mysql://localhost:3306/mydb?serverTimezone=Asia/Kolkata
    username: myuser
    password: mypassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata