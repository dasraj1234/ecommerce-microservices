services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecom-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecom-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mysql:
    image: mysql:8
    container_name: ecom-mysql
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: myuser            # matches application-dev.properties
      MYSQL_PASSWORD: mypassword    # matches application-dev.properties
      MYSQL_ROOT_PASSWORD: rootpassword
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      # Auto-runs on FIRST init only (when the data volume is empty).
      - ./ecommerce_db_11thjuly_docker.sql:/docker-entrypoint-initdb.d/ecommerce_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysqldata: